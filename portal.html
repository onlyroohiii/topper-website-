<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOPPERS Portal</title><link rel="stylesheet" href="styles.css"></head><body><main class="portal-page"><section class="login-card"><a class="brand" href="index.html">◆ TOPPERS</a><h1 id="title">Portal login</h1><p id="desc">Welcome to your TOPPERS space.</p><form id="login"><label>Unique ID<input required placeholder="Enter your ID" autocomplete="username"></label><label>Password<input type="password" required placeholder="Enter your password" autocomplete="current-password"></label><button class="btn primary">Continue →</button></form><div class="warning"><b>Preview only:</b> Login is not connected to a real authentication system. Do not enter real passwords or student information.</div><a class="back" href="index.html">← Back to homepage</a></section></main><script>const role=new URLSearchParams(location.search).get('role')||'student';const names={admin:'Admin',teacher:'Teacher',parent:'Parent',student:'Student'};document.querySelector('#title').textContent=names[role]+' portal';document.querySelector('#desc').textContent='Welcome to the TOPPERS '+names[role].toLowerCase()+' space. This is a design preview.';document.querySelector('#login').addEventListener('submit',e=>{e.preventDefault();alert('Frontend preview only. Secure login has not been connected. Please do not use real credentials.');});</script></body></html>
